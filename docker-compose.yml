version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: todoapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: todoapp_user
      POSTGRES_PASSWORD: todoapp_pass123
      POSTGRES_DB: todoapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoapp_user -d todoapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todoapp_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: todoapp_db
      DB_USER: todoapp_user
      DB_PASSWORD: todoapp_pass123
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"

volumes:
  postgres_data:
